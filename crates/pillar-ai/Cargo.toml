[package]
name = "pillar-ai"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Unified multi-provider LLM API. Port of pi packages/ai (pi v0.84.3)."

[dependencies]
async-trait = "0.1.89"
fastrand = "2.3"
futures = "0.3.31"
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "http2",
    "charset",
    "stream",
    "blocking",
] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.47", features = ["sync", "time", "macros", "rt", "rt-multi-thread", "fs" ] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
uuid = { version = "1.18", features = ["v7"] }
zstd = "0.13"
