[package]
name = "pillar-ai"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Unified multi-provider LLM API. Port of pi packages/ai (pi v0.84.3)."

[dependencies]
async-trait = "0.1.89"
fastrand = "2.3"
futures = "0.3.31"
regex = "1.12"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.47", features = ["sync", "time", "macros", "rt"] }

# wasm32-unknown-unknown has no OS and no tokio runtime. rustls, zstd-sys (C),
# tokio fs/process, and tokio-tungstenite are native-only. On wasm the HTTP and
# websocket transports are host-injected (see `transport::FetchFn`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", optional = true, default-features = false, features = [
    "rustls",
    "gzip",
    "http2",
    "charset",
    "stream",
    "blocking",
] }
tokio = { version = "1.47", features = ["rt-multi-thread", "fs"] }
tokio-tungstenite = { version = "0.30", optional = true, default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
] }
zstd = { version = "0.13", optional = true }

[features]
default = ["providers"]
# The built-in provider catalog (per-API adapters, HTTP transport, the model
# registry, provider auth). Without it the crate is the core an embedding host
# drives with its own `StreamFn` (docs/DEVELOPMENT-STRATEGY.md §4).
providers = ["dep:reqwest", "dep:tokio-tungstenite", "dep:zstd"]
# The live model-catalog generator needs a native blocking HTTP client and
# filesystem access; it is opt-in so wasm and ordinary builds skip it.
generate-models = []

[[bin]]
name = "generate-models"
path = "src/bin/generate-models.rs"
required-features = ["generate-models"]
