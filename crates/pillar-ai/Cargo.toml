[package]
name = "pillar-ai"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Unified multi-provider LLM API. Port of pi packages/ai (pi v0.84.3)."

[dependencies]
async-trait = "0.1.89"
futures = "0.3.31"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.47", features = ["sync", "time", "macros", "rt", "fs" ] }
uuid = { version = "1.18", features = ["v7"] }
regex = "1.12"
