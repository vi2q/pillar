[package]
name = "pillar-tui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Terminal UI. Port of pi packages/tui (pi v0.84.3)."

[dependencies]
serde.workspace = true
serde_json.workspace = true
pulldown-cmark = "0.13"
base64 = "0.22"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Raw mode / terminal size / Windows console handling. The process terminal is
# excluded on wasm (host-provided terminal).
crossterm = "0.29"
