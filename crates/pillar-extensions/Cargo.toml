[package]
name = "pillar-extensions"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# No dependency on pillar-coding-agent: the shared shapes live in the contract
# crate, and the host joins the two (docs/DEVELOPMENT-STRATEGY.md §4). The
# profile gate asserts this edge stays gone.
# The VM takes the *contract* form of the runtime, not the coding agent's native
# surface: the OS-bound features (harness tools, the provider catalog, the
# file-backed session store, the native search scanner) stay off here, and the
# development CLI turns them on at its own root. Otherwise "LMPC plus Luau"
# silently re-enables every provider and the terminal-adjacent tooling (policy
# review sb39f R9).
pillar-agent = { path = "../pillar-agent", default-features = false }
pillar-extensions-contract = { path = "../pillar-extensions-contract" }
pillar-ai = { path = "../pillar-ai", default-features = false }
# `async`: waiting host calls (pillar.exec, ctx.ui.*) suspend the Lua coroutine
# and resume when the host's future is ready, so the wait does not block the
# extension's thread (TASKS: 非同期 host 呼出). The executor stays the host's —
# luaur-rt is executor-agnostic like mlua.
luaur-rt = { version = "0.1.8", features = ["serde", "typecheck", "send", "async"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
futures = "0.3.31"
tempfile = "3"
tokio = { version = "1.47", features = ["rt", "macros", "time"] }
