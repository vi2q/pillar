[package]
name = "pillar-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The pillar binary: wires the coding agent (pi port) to the Luau extension runtime."

[[bin]]
name = "pillar"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
pillar-coding-agent = { path = "../pillar-coding-agent" }
pillar-extensions = { path = "../pillar-extensions", optional = true }
pillar-agent = { path = "../pillar-agent" }
pillar-ai = { path = "../pillar-ai" }
serde_json.workspace = true
tokio = { version = "1.47", features = ["rt", "macros"] }

[features]
default = ["luau"]
# The Luau extension runtime. Without it (`--no-default-features`) the binary
# builds and runs with no VM, no `luaur`, and no extension loading.
luau = ["dep:pillar-extensions"]

[dev-dependencies]
tokio = { version = "1.47", features = ["rt", "macros", "time"] }
