[package]
name = "pillar-coding-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Coding agent core. Port of pi packages/coding-agent (pi v0.84.3)."

[dependencies]
pillar-ai = { path = "../pillar-ai" }
pillar-agent = { path = "../pillar-agent" }
pillar-protocol = { path = "../pillar-protocol" }
pillar-tui = { path = "../pillar-tui" }
serde.workspace = true
serde_json.workspace = true
regex = "1.12"
async-trait = "0.1"
base64 = "0.22"
globset = "0.4.19"
ignore = "0.4"
similar = "2"
semver = "1"
tokio = { version = "1.47", features = ["sync", "time"] }

# Native-only: advisory file locks (wasm32 has no descriptor locking).
# wasm builds use in-process serialization instead (docs/TASKS.md task 3).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fd-lock = "4"

# Unix-only: SIGTERM before SIGKILL when a command is aborted
# (`core::exec`, upstream `exec.ts`).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tokio = { version = "1.47", features = ["rt", "macros", "time"] }
