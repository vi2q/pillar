[package]
name = "pillar-extensions-contract"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The extension contract shared by the Luau runtime and the coding agent (no TUI, no CLI)."

[dependencies]
# A leaf contract: it needs the runtime's shapes, not the coding agent's native
# surface (see crates/pillar-extensions/Cargo.toml).
pillar-agent = { path = "../pillar-agent", default-features = false }
serde.workspace = true
serde_json.workspace = true
