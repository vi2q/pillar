[package]
name = "pillar-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Agent runtime with tool calling and state management. Port of pi packages/agent (pi v0.84.3)."

[dependencies]
async-trait = "0.1.89"
futures = "0.3.31"
tokio = { version = "1.47", features = ["rt", "sync", "time", "macros", "fs", "process"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
pillar-ai = { path = "../pillar-ai" }
globset = "0.4.19"

[dev-dependencies]
tokio = { version = "1.47", features = ["rt", "macros", "time"] }
