[package]
name = "pillar-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Agent runtime with tool calling and state management. Port of pi packages/agent (pi v0.84.3)."

[features]
default = ["harness-tools", "proxy", "search", "session-files", "exp", "rust-tools"]
# The OS-bound coding-agent surface: the harness's file/shell tools and the
# native session-search scanner. An embedding profile with a host-provided
# tool set and no filesystem turns them off (`--no-default-features`), which is
# what the LMPC minimum does (docs/DEVELOPMENT-STRATEGY.md §4/§5-6).
harness-tools = ["dep:globset", "pillar-ai/providers"]
# The proxy stream path sends through the provider HTTP transport.
proxy = ["pillar-ai/providers"]
search = []
# The durable JSONL file-backed session backend.
session-files = []
# The experimental tool adapter (versioned read references, budgets, receipts).
# It is a capability a profile opts into and the LMPC minimum leaves off, so an
# embedding that never registers these tools neither compiles nor links them
# (docs/TOOL-EFFICIENCY-DESIGN.md §9, §11).
exp = []
# The Rust-specific tooling core (saved Cargo metadata, normalized rustc JSON
# diagnostics, verify planning, suggestion application). Pure parsing, planning
# and patch construction: no Cargo, LSP or OS process, so the LMPC minimum can
# leave it off without losing anything (docs/RUST-TOOLING-DESIGN.md §1, §2).
# Suggestion application reuses the experimental adapter's conditional store,
# operation ledger and receipts (docs/TOOL-EFFICIENCY-DESIGN.md §4, §7).
rust-tools = ["exp"]

[dependencies]
async-trait = "0.1.89"
futures = "0.3.31"
tokio = { version = "1.47", features = ["rt", "sync", "time", "macros"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The core takes the provider-free form: the provider catalog is a feature the
# coding agent (and the CLI) turn on (docs/DEVELOPMENT-STRATEGY.md §4).
pillar-ai = { path = "../pillar-ai", default-features = false }
pillar-telemetry = { path = "../pillar-telemetry" }
globset = { version = "0.4.19", optional = true }
# JSON-Schema `pattern` (already in the workspace graph via pillar-ai).
regex = "1.12"

# Native-only: tokio's fs/process features pull in `net`, which mio does not
# support on wasm32-unknown-unknown. Filesystem and shell execution are
# host-provided there (see docs/TASKS.md task 3).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.47", features = ["fs", "process", "io-util"] }

[dev-dependencies]
tokio = { version = "1.47", features = ["rt", "macros", "time"] }
filetime = "0.2"
