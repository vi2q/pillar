# The CI gate (docs/DEVELOPMENT.md § CI): the same commands a developer runs
# through scripts/ci.sh, split across jobs so each phase gets a fresh runner and
# its own log. One job running the whole gate was killed by the hosted runner
# ("the hosted runner lost communication") after ~47 minutes.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # scripts/ci.sh runs offline to catch a lockfile/cache miss; every job keeps
  # that policy (the setup action's fetch step overrides it once).
  CARGO_NET_OFFLINE: "true"
  # Keep the build artifacts small enough for a hosted runner: with full debug
  # info and incremental state the workspace `target/` is ~28 GB locally.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # scripts/check.sh --quick is the build / no-Luau build / clippy -D warnings
      # / sandboxed smoke half of the gate (the test and Wasm phases are their
      # own jobs).
      - name: build, lint and smoke
        run: bash scripts/check.sh --quick

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: tests
        run: cargo test --locked --workspace

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # A missing host or target must fail this job, not skip it.
      PILLAR_REQUIRE_WASM_COMPARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The compile axis and the §5-7 native/Wasm comparison (scripts/check.sh
      # runs the same lines when it is invoked in full).
      - name: wasm checks
        run: |
          cargo check --locked -p pillar-agent -p pillar-extensions --target wasm32-unknown-unknown
          cargo check --locked -p pillar-lmpc --target wasm32-unknown-unknown
          cargo check --locked -p pillar-agent --no-default-features
          cargo check --locked -p pillar-agent --no-default-features --target wasm32-unknown-unknown
      - name: wasm comparison
        run: bash scripts/wasm_compare.sh
