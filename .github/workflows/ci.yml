# The CI gate (docs/DEVELOPMENT.md § CI): the same script a developer runs, with
# the toolchain pinned so the Wasm artifact and the baselines stay comparable.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Keep the build artifacts small enough for a hosted runner. With full
      # debug info the workspace `target/` is ~28 GB locally, past the runner's
      # disk, and the job dies with "the hosted runner lost communication".
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      # The toolchain is pinned: the recorded baselines used 1.91.1, and a
      # different compiler changes the artifact the comparison gate runs.
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: "25"

      # Cache only the cargo caches: `target/` is far larger than the GitHub
      # cache budget (10 GB). `scripts/ci.sh` sets CARGO_NET_OFFLINE, so a
      # dependency missing from the lockfile or the cache must fail here rather
      # than download quietly.
      - name: cache (cargo)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Warm the caches with the network on before the offline gate: the pinned
      # luaur dependency is a git checkout, not a registry crate, so a cold
      # runner cannot resolve it under CARGO_NET_OFFLINE.
      - name: fetch (network)
        run: |
          cargo fetch --locked
          cargo fetch --locked --target wasm32-unknown-unknown

      - name: gate
        run: bash scripts/ci.sh
