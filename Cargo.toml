[workspace]
resolver = "3"
members = [
    "crates/pillar-protocol",
    "crates/pillar-telemetry",
    "crates/pillar-ai",
    "crates/pillar-agent",
    "crates/pillar-coding-agent",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.20"

[profile.release]
lto = "fat"
codegen-units = 1
